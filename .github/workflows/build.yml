name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Chọn Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || true
      - name: Build IPA
        run: bash build_ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ScanPro-ipa
          path: build/ScanPro.ipa
