name: ScanPro
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
targets:
  ScanPro:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "**/*.swift"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ScanPro
        NSCameraUsageDescription: Ứng dụng cần camera để quét tài liệu.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.scanpro
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
